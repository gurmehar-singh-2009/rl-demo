name: Build RL Demo

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ============================================================
  # WINDOWS
  # ============================================================

  build-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --locked

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build
        run: |
          uv run pyinstaller `
            --name RL-Demo `
            --onefile `
            --windowed `
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RL-Demo-windows
          path: dist/RL-Demo.exe


  # ============================================================
  # LINUX
  # ============================================================

  build-linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --locked

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build
        run: |
          uv run pyinstaller \
            --name RL-Demo \
            --onefile \
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RL-Demo-linux
          path: dist/RL-Demo


  # ============================================================
  # MACOS
  # ============================================================

  build-macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --locked

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build
        run: |
          uv run pyinstaller \
            --name RL-Demo \
            --windowed \
            main.py

      - name: Package
        run: |
          cd dist
          zip -r RL-Demo-macos.zip RL-Demo.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RL-Demo-macos
          path: dist/RL-Demo-macos.zip


  # ============================================================
  # WEB / GITHUB PAGES
  # ============================================================

  build-web:
    name: Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install web dependencies
        run: |
          uv pip install pygbag

      - name: Build web version
        run: |
          uv run pygbag \
            --build \
            --template default \
            --width 1280 \
            --height 720 \
            .

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web


  # ============================================================
  # DEPLOY GITHUB PAGES
  # ============================================================

  deploy-pages:
    name: Deploy GitHub Pages
    needs: build-web

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4


  # ============================================================
  # GITHUB RELEASE
  # ============================================================

  release:
    name: GitHub Release

    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - build-windows
      - build-linux
      - build-macos

    runs-on: ubuntu-latest

    steps:
      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: RL-Demo-windows
          path: release/windows

      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: RL-Demo-linux
          path: release/linux

      - name: Download macOS
        uses: actions/download-artifact@v4
        with:
          name: RL-Demo-macos
          path: release/macos

      - name: Package Linux
        run: |
          tar -czf \
            release/RL-Demo-linux.tar.gz \
            -C release/linux \
            RL-Demo

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/windows/RL-Demo.exe
            release/RL-Demo-linux.tar.gz
            release/macos/RL-Demo-macos.zip
