name: Build RL Demo

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write


jobs:
  # ============================================================
  # WINDOWS
  # ============================================================

  build-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build
        run: |
          uv run pyinstaller `
            --name RL-Demo `
            --onefile `
            --windowed `
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: RL-Demo-windows
          path: dist/RL-Demo.exe
          if-no-files-found: error


  # ============================================================
  # LINUX
  # ============================================================

  build-linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build
        run: |
          uv run pyinstaller \
            --name RL-Demo \
            --onefile \
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: RL-Demo-linux
          path: dist/RL-Demo
          if-no-files-found: error


  # ============================================================
  # MACOS
  # ============================================================

  build-macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build
        run: |
          uv run pyinstaller \
            --name RL-Demo \
            --windowed \
            main.py

      - name: Package
        run: |
          cd dist
          zip -r RL-Demo-macos.zip RL-Demo.app

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: RL-Demo-macos
          path: dist/RL-Demo-macos.zip
          if-no-files-found: error


  # ============================================================
  # WEB / GITHUB PAGES
  # ============================================================

  build-web:
    name: Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Pygbag
        run: |
          uv pip install \
            "pygbag @ git+https://github.com/pygame-web/pygbag.git"

      # --------------------------------------------------------
      # Create a clean directory for Pygbag.
      #
      # DO NOT build "." because the repository root contains
      # .venv, and pygbag will recursively inspect it.
      # --------------------------------------------------------

      - name: Prepare web build
        run: |
          rm -rf web_build
          mkdir -p web_build

          cp main.py web_build/

          if [ -d src/rl_demo ]; then
            cp -r src/rl_demo web_build/rl_demo
          fi

          if [ -d assets ]; then
            cp -r assets web_build/assets
          fi

      - name: Build web version
        run: |
          uv run pygbag \
            --build \
            --template default.tmpl \
            --width 1280 \
            --height 720 \
            web_build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web_build/build/web


  # ============================================================
  # DEPLOY GITHUB PAGES
  # ============================================================

  deploy-pages:
    name: Deploy GitHub Pages
    needs: build-web

    # Only deploy the actual main branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4


  # ============================================================
  # GITHUB RELEASE
  # ============================================================

  release:
    name: GitHub Release

    # Only run for tags like v0.1.0, v1.0.0, etc.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    needs:
      - build-windows
      - build-linux
      - build-macos

    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # Download native artifacts
      # --------------------------------------------------------

      - name: Download Windows
        uses: actions/download-artifact@v8
        with:
          name: RL-Demo-windows
          path: release/windows

      - name: Download Linux
        uses: actions/download-artifact@v8
        with:
          name: RL-Demo-linux
          path: release/linux

      - name: Download macOS
        uses: actions/download-artifact@v8
        with:
          name: RL-Demo-macos
          path: release/macos

      # --------------------------------------------------------
      # Package Linux
      # --------------------------------------------------------

      - name: Package Linux
        run: |
          tar -czf \
            release/RL-Demo-linux.tar.gz \
            -C release/linux \
            RL-Demo

      # --------------------------------------------------------
      # Create GitHub Release
      # --------------------------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release/windows/RL-Demo.exe
            release/RL-Demo-linux.tar.gz
            release/macos/RL-Demo-macos.zip
